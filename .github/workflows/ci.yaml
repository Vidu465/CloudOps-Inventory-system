name: CloudOps Inventory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CloudOps-Inventory-System/backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run automated tests
        working-directory: backend
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudops-inventory-api:${{ github.sha }} ./backend
